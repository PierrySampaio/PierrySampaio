name: Generate Snake Contribution Animation

on:
  schedule:
    # Executa a cada 12 horas para atualizar com os novos commits
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8D03B0&color_dots=#ebedf0,#d8b4e2,#ba68c8,#8D03B0,#4a148c
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#d8b4e2&color_dots=#161b22,#4a148c,#6a1b9a,#8D03B0,#ba68c8

      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
