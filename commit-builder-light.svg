<svg width="800" height="150" viewBox="0 0 800 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Estilos e Animação -->
  <style>
    @keyframes buildCommit {
      0% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes moveShip {
      0% { transform: translate(0, 0); }
      100% { transform: translate(750px, 0); }
    }
    .commit-block {
      fill: #ebedf0; /* Cor base (commit vazio) */
      animation: buildCommit 0.5s ease-out forwards;
      opacity: 0;
    }
    .ship {
      animation: moveShip 10s linear infinite;
    }
  </style>

  <!-- Definição da Nave (Formato Simples) -->
  <defs>
    <g id="spaceship">
      <path d="M20 5 L35 20 L20 35 L5 20 Z" fill="#8D03B0" stroke="#000000" stroke-width="2"/>
      <path d="M10 20 H30" stroke="#000000" stroke-width="2"/>
    </g>
  </defs>

  <!-- Grade de Contribuições (Estilo GitHub Simplificado) -->
  <g transform="translate(10, 50)">
    <rect x="0" y="0" width="20" height="20" rx="4" class="commit-block" style="animation-delay: 0s; fill: #ce93d8;"/>
    <rect x="25" y="0" width="20" height="20" rx="4" class="commit-block" style="animation-delay: 0.5s; fill: #ba68c8;"/>
    <rect x="50" y="0" width="20" height="20" rx="4" class="commit-block" style="animation-delay: 1s; fill: #ebedf0;"/>
    <rect x="75" y="0" width="20" height="20" rx="4" class="commit-block" style="animation-delay: 1.5s; fill: #8D03B0;"/>
    <rect x="100" y="0" width="20" height="20" rx="4" class="commit-block" style="animation-delay: 2s; fill: #ce93d8;"/>
    <rect x="125" y="0" width="20" height="20" rx="4" class="commit-block" style="animation-delay: 2.5s; fill: #ebedf0;"/>
    <rect x="150" y="0" width="20" height="20" rx="4" class="commit-block" style="animation-delay: 3s; fill: #ba68c8;"/>
  </g>

  <!-- Nave Animada que passa por cima -->
  <g class="ship" transform="translate(0, 30)">
    <use href="#spaceship"/>
  </g>
</svg>
